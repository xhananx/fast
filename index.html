<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HybridSpeed — Internet Speed Test</title>
  <meta name="description"
    content="Test your internet speed with HybridSpeed. Accurate download, upload, ping, and jitter measurements for gamers.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2300f0ff'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='%230a0e1a'/%3E%3Cpath d='M8 22 L16 6 L24 22' stroke='url(%23g)' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='22' r='2.5' fill='%2300f0ff'/%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>
  <div class="page">
    <!-- Particle Canvas Background -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- Page Preloader -->
    <div class="page-preloader" aria-hidden="true">
      <div class="page-preloader__spinner"></div>
    </div>

    <!-- Scanline Overlay -->
    <div class="scanline-overlay" aria-hidden="true"></div>

    <!-- Header -->
    <header class="site-header">
      <div class="site-header__container">
        <a href="index.html" class="brand" aria-label="HybridSpeed Home">
          <span class="brand__icon">
            <span class="material-symbols-rounded" style="font-size: 18px;">bolt</span>
          </span>
          <span class="brand__text">Hybrid<span class="brand__accent">Speed</span></span>
        </a>

        <nav class="header-nav" id="headerNav" aria-label="Main Navigation">
          <div class="nav-links">
            <a href="index.html" class="nav-link" data-nav="home">Speed Test</a>
            <span class="nav-divider" aria-hidden="true"></span>
            <a href="analytics.html" class="nav-link" data-nav="analytics">Analytics</a>
          </div>
        </nav>

        <div class="header-actions">
          <button class="btn-icon mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" aria-expanded="false"
            aria-controls="headerNav">
            <span class="material-symbols-rounded">menu</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <section class="hero-section">
        <div class="hero-section__bg">
          <div class="bg-grid" aria-hidden="true"></div>
          <div class="bg-glow" style="top: -200px; right: -200px;" aria-hidden="true"></div>
          <div class="bg-glow" style="bottom: -200px; left: -200px; opacity: 0.3;" aria-hidden="true"></div>
        </div>

        <div class="hero-section__content animate-fade-in-up">
          <!-- Decorative Ring Behind Button -->
          <div class="speed-display">
            <div class="deco-ring" aria-hidden="true">
              <svg class="deco-ring__svg" viewBox="0 0 400 400" fill="none">
                <circle cx="200" cy="200" r="180" stroke="currentColor" stroke-width="0.5" stroke-dasharray="6 10"
                  opacity="0.2" />
                <circle cx="200" cy="200" r="160" stroke="currentColor" stroke-width="0.3" stroke-dasharray="3 8"
                  opacity="0.1" />
                <circle cx="200" cy="200" r="195" stroke="currentColor" stroke-width="0.3" stroke-dasharray="2 14"
                  opacity="0.15" />
              </svg>
            </div>

            <!-- Ripple Effects -->
            <div class="ripple-container" aria-hidden="true">
              <div class="ripple animate-ripple"></div>
              <div class="ripple animate-ripple animate-ripple-delay-1"></div>
              <div class="ripple animate-ripple animate-ripple-delay-2"></div>
            </div>

            <!-- Start Button -->
            <button id="startButton" class="start-button" aria-label="Start Speed Test" style="position: absolute;">
              <div class="start-button__content">
                <span class="material-symbols-rounded start-button__icon" aria-hidden="true">play_arrow</span>
                <span class="start-button__text">START</span>
                <span class="start-button__subtitle">Speed Test</span>
              </div>
            </button>
          </div>

          <!-- Status Header -->
          <div class="status-header">
            <h1 class="status-header__title">
              <span class="status-header__title-accent">READY</span> // PLAYER ONE
            </h1>
            <p class="status-header__subtitle">Press START or hit <span class="kbd-badge">SPACE</span> to launch test
            </p>
          </div>

          <!-- Info Cards -->
          <div class="hero-section container-narrow stagger-2">
            <div class="metrics-grid" style="grid-template-columns: repeat(3, 1fr);">
              <!-- Server Node -->
              <div class="info-card animate-fade-in stagger-3">
                <div class="info-card__header">
                  <span class="info-card__label">Server Node</span>
                  <span class="material-symbols-rounded info-card__icon" style="font-size: 18px;">dns</span>
                </div>
                <div class="info-card__value">
                  <span class="info-card__value-text" data-info="server">—</span>
                  <span class="status-dot" data-info="status-dot" aria-label="Server Status"></span>
                </div>
              </div>

              <!-- Connection IP -->
              <div class="info-card animate-fade-in stagger-4">
                <div class="info-card__header">
                  <span class="info-card__label">Connection</span>
                  <span class="material-symbols-rounded info-card__icon" style="font-size: 18px;">language</span>
                </div>
                <div class="info-card__value">
                  <span class="info-card__value-text" data-info="ip">—</span>
                </div>
              </div>

              <!-- Latency -->
              <div class="info-card animate-fade-in stagger-5">
                <div class="info-card__header">
                  <span class="info-card__label">Server Ping</span>
                  <span class="material-symbols-rounded info-card__icon" style="font-size: 18px;">speed</span>
                </div>
                <div class="info-card__value">
                  <span class="info-card__value-text" data-info="latency">-- ms</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <div class="site-footer__content">
          <span class="site-footer__text">© 2026 HybridSpeed</span>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__text">Built for Gamers</span>
          <span class="site-footer__divider">|</span>
          <span class="site-footer__text" style="opacity: 0.5; font-size: 10px;">v1.0.0</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/particles.js"></script>
</body>

</html>
